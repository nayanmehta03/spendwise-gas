<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <base target="_top" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Spendwise</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1f2e'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%234f8ef7' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='serif' font-size='14' font-weight='bold' fill='%234f8ef7'%3E%E2%82%B9%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
  <?!= include('shared-styles'); ?>
</head>

<body class="<?= sidebarCollapsed ? 'sidebar-collapsed' : '' ?>">

  <!-- DESKTOP SIDEBAR (>= 1024px; hidden below, where the overlay nav takes over) -->
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-brand" onclick="navigateTo('dashboard')" title="Spendwise">
      <span class="sidebar-logo">₹</span>
      <span class="sidebar-brand-text">
        <span class="sidebar-brand-name">Spendwise</span>
        <span class="sidebar-brand-sub">Expense Tracker</span>
      </span>
    </button>

    <!-- Rendered from PAGES at boot by _renderNavs() -->
    <nav class="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <button class="sidebar-item" id="sidebarToggle" onclick="toggleSidebar()" title="Collapse sidebar">
        <span class="sidebar-icon"><i class="ph ph-caret-double-left sidebar-collapse-icon"></i></span>
        <span class="sidebar-text">
          <span class="sidebar-label">Collapse</span>
        </span>
      </button>
    </div>
  </aside>

  <!-- CENTERED OVERLAY NAV -->
  <div id="navOverlay" class="nav-overlay" onclick="closeNav()">
    <button class="nav-overlay-close" onclick="closeNav()"><i class="ph ph-x"></i></button>
    <!-- Rendered from PAGES at boot by _renderNavs() -->
    <nav class="nav-overlay-menu"></nav>
  </div>

  <!-- TOPBAR -->
  <header class="topbar" id="topbar">
    <button class="hamburger-btn" onclick="openNav()" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title" id="topbarTitle">Spendwise</div>
    <div class="topbar-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh"><i class="ph ph-arrows-clockwise"></i></button>
    </div>
  </header>

  <!-- PAGE VIEWS — all included at build time, shown/hidden by router -->
  <main id="appMain">

    <div id="view-add" class="page-view">
      <?!= include('page-add'); ?>
    </div>

    <div id="view-dashboard" class="page-view">
      <?!= include('page-dashboard'); ?>
    </div>

    <div id="view-expenses" class="page-view">
      <?!= include('page-expenses'); ?>
    </div>

    <div id="view-analytics" class="page-view">
      <?!= include('page-analytics'); ?>
    </div>

    <div id="view-income" class="page-view">
      <?!= include('page-income'); ?>
    </div>

    <div id="view-standing" class="page-view">
      <?!= include('page-standing'); ?>
    </div>

    <div id="view-settings" class="page-view">
      <?!= include('page-settings'); ?>
    </div>

  </main>

  <!-- FLOATING ADD BUTTON (hidden on Add page and when scrolling) -->
  <button class="fab" id="fab" onclick="navigateTo('add')" aria-label="Add expense">＋</button>

  <!-- Shared nav, toast, edit modal, shared JS -->
  <?!= include('shared-nav'); ?>

  <script>
    // ============================================================
    // SPA ROUTER
    // ============================================================
    // Single source of truth for the seven pages. Title, icon, sidebar
    // description, accent and group all live here and both navs render from it,
    // so adding a page is one entry rather than three coordinated edits.
    const PAGES = {
      add:       { title: 'Add Expense', icon: 'ph-plus',             desc: 'Log a spend',           accent: '--accent',  group: 'Record', init: () => typeof initAdd === 'function' && initAdd() },
      income:    { title: 'Income',      icon: 'ph-arrow-down',       desc: 'Money in',              accent: '--accent2', group: 'Record', init: () => typeof initIncome === 'function' && initIncome() },
      standing:  { title: 'Recurring',   icon: 'ph-arrows-clockwise', desc: 'Standing instructions', accent: '--accent4', group: 'Record', init: () => typeof initStanding === 'function' && initStanding() },
      dashboard: { title: 'Dashboard',   icon: 'ph-squares-four',     desc: 'Budget & overview',     accent: '--accent',  group: 'Review', init: () => typeof initDashboard === 'function' && initDashboard() },
      expenses:  { title: 'Expenses',    icon: 'ph-list',             desc: 'Browse & filter',       accent: '--accent3', group: 'Review', init: () => typeof initExpenses === 'function' && initExpenses() },
      analytics: { title: 'Analytics',   icon: 'ph-chart-pie-slice',  desc: 'Trends & breakdown',    accent: '--accent4', group: 'Review', init: () => typeof initAnalytics === 'function' && initAnalytics() },
      settings:  { title: 'Settings',    icon: 'ph-gear',             desc: 'Categories & budgets',  accent: '--text2',   group: 'Manage', init: () => typeof initSettings === 'function' && initSettings() },
    };

    // Paints the desktop rail and the mobile overlay from the same map. Clicks
    // are delegated, so the two navs also share one active-state mechanism
    // (data-page) instead of the overlay matching on its onclick string.
    function _renderNavs() {
      const rail = document.querySelector('.sidebar-nav');
      const overlay = document.querySelector('.nav-overlay-menu');
      let group = null, railHtml = '', overlayHtml = '';

      Object.entries(PAGES).forEach(([key, p]) => {
        if (p.group !== group) {
          group = p.group;
          railHtml += '<div class="sidebar-section">' + group + '</div>';
        }
        railHtml +=
          '<button class="sidebar-item" data-page="' + key + '" style="--item:var(' + p.accent + ');" title="' + p.title + '">'
          + '<span class="sidebar-icon"><i class="ph ' + p.icon + '"></i></span>'
          + '<span class="sidebar-text">'
          + '<span class="sidebar-label">' + p.title + '</span>'
          + '<span class="sidebar-desc">' + p.desc + '</span>'
          + '</span></button>';
        overlayHtml +=
          '<button class="nav-overlay-item" data-page="' + key + '">'
          + '<span class="nav-overlay-icon"><i class="ph ' + p.icon + '"></i></span>'
          + '<span class="nav-overlay-label">' + p.title + '</span>'
          + '</button>';
      });

      rail.innerHTML = railHtml;
      overlay.innerHTML = overlayHtml;

      [rail, overlay].forEach(el => el.addEventListener('click', ev => {
        const btn = ev.target.closest('[data-page]');
        if (btn) navigateTo(btn.dataset.page);
      }));
    }

    const _initialized = {};
    let _currentPage = null;

    // FAB: hide while scrolling, show on Add page
    let _lastScrollY = 0;
    window.addEventListener('scroll', () => {
      const fab = document.getElementById('fab');
      if (!fab) return;
      const going = window.scrollY > _lastScrollY + 10;
      fab.classList.toggle('fab-hidden', going);
      _lastScrollY = window.scrollY;
    }, { passive: true });

    function navigateTo(page) {
      if (!PAGES[page]) return;
      closeNav();

      // Hide all views
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));

      // Show target view
      const view = document.getElementById('view-' + page);
      if (view) view.classList.add('active');

      // Update title
      document.getElementById('topbarTitle').textContent = PAGES[page].title;

      // FAB: hide on Add and Income pages (both have inline forms)
      const fab = document.getElementById('fab');
      if (fab) {
        if (page === 'add' || page === 'income' || page === 'standing') {
          fab.style.display = 'none';
        } else {
          fab.style.display = '';
          fab.classList.remove('fab-hidden');
        }
      }

      // Mark active nav item (both navs key off data-page)
      document.querySelectorAll('.sidebar-item[data-page], .nav-overlay-item[data-page]').forEach(el => {
        el.classList.toggle('active', el.dataset.page === page);
      });

      // Lazy init: call page init function only on first visit
      if (!_initialized[page]) {
        _initialized[page] = true;
        PAGES[page].init();
      }

      _currentPage = page;

      // Push URL state (best-effort — GAS may ignore the hash)
      try {
        history.replaceState({ page }, '', location.href.split('?')[0] + '?page=' + page);
      } catch (e) { }
    }

    // ── Desktop sidebar collapse (persisted) ────────────────────
    function _applySidebarState(collapsed) {
      document.body.classList.toggle('sidebar-collapsed', collapsed);
      const btn = document.getElementById('sidebarToggle');
      if (btn) {
        btn.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        const label = btn.querySelector('.sidebar-label');
        if (label) label.textContent = collapsed ? 'Expand' : 'Collapse';
      }
    }

    function toggleSidebar() {
      const collapsed = !document.body.classList.contains('sidebar-collapsed');
      _applySidebarState(collapsed);
      // Fire-and-forget: the preference is cosmetic, so a failed write must
      // never interrupt the user. doGet renders it back onto <body>.
      google.script.run.withFailureHandler(function () { }).setSidebarCollapsed(collapsed);
    }

    // The class is already on <body> from the server; this only syncs the
    // toggle button label and tooltip to match it.
    _applySidebarState(document.body.classList.contains('sidebar-collapsed'));

    // Overlay nav: toggle open/close
    function openNav() {
      document.getElementById('navOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeNav() {
      document.getElementById('navOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    // Refresh button delegates to current page
    document.getElementById('refreshBtn').addEventListener('click', () => {
      const fn = { add: 'refreshAdd', income: 'refreshIncome', standing: 'refreshStanding', dashboard: 'refreshDashboard', expenses: 'refreshExpenses', analytics: 'refreshAnalytics', settings: 'refreshSettings' }[_currentPage];
      if (fn && typeof window[fn] === 'function') window[fn]();
      else showToast('Refreshed', 'info');
    });

    // ── Boot: activate initial page from server ──────────────────
    // initPage is injected server-side via <?= initPage ?> scriptlet
    const _bootPage = '<?= initPage ?>';
    _renderNavs();
    navigateTo(_bootPage || 'add');
  </script>

</body>

</html>
